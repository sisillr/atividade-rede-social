{% extends "base.html" %}
{% block title %}Chat — cozy club{% endblock %}

{% block content %}
<h1 class="page-greeting">Olá, {{ usuario_nome }}!</h1>
<p class="page-subtitle">Interaja conscientemente com os outros usuários.</p>

<h2 class="section-heading">Chat</h2>

<div id="mensagens" class="chat-box"></div>

<div class="d-flex gap-2" style="max-width: 820px;">
  <input
    type="text"
    id="campo-mensagem"
    class="form-control auth-input"
    placeholder="Digite sua mensagem sobre hobbies..."
    autocomplete="off"
  >
  <button type="button" id="btn-enviar" class="btn-vinho">Enviar</button>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io();
  const mensagensDiv = document.getElementById("mensagens");
  const campoMsg = document.getElementById("campo-mensagem");
  const btnEnviar = document.getElementById("btn-enviar");

  socket.on("connect", () => {
    socket.emit("join");
  });

  socket.on("showmsg", (data) => {
    const item = document.createElement("div");
    item.className = "mb-3";
    item.innerHTML = `
      <div class="d-flex align-items-center gap-2">
        <span class="avatar-circulo" style="background-color: #fdbcc4; border: none;"></span>
        <strong>${data.usuario}</strong>
      </div>
      <div class="ms-5" style="color: var(--rosa-texto);">${data.mensagem}</div>
    `;
    mensagensDiv.appendChild(item);
    mensagensDiv.scrollTop = mensagensDiv.scrollHeight;
  });

  function enviarMensagem() {
    const texto = campoMsg.value.trim();
    if (!texto) return;
    socket.emit("msg", { mensagem: texto });
    campoMsg.value = "";
    campoMsg.focus();
  }

  btnEnviar.addEventListener("click", enviarMensagem);
  campoMsg.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      enviarMensagem();
    }
  });
</script>
{% endblock %}
